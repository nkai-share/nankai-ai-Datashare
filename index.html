<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="UTF-8">
  <title>NKAI 资料共享计划</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="南开 AI 资料共享计划，整理课程复习资料、往年真题、课件与学习笔记。">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css" />
  <style>
    :root { --theme-color: #702670; }

    body {
      color: #27313b;
    }

    .sidebar {
      border-right: 1px solid #e7e1e8;
    }

    .sidebar-nav {
      line-height: 1.45;
    }

    .sidebar-nav li > strong {
      cursor: pointer;
      display: block;
      padding: 5px 0;
    }

    .sidebar-nav a,
    .markdown-section a {
      overflow-wrap: anywhere;
    }

    .sidebar-nav li.resource-hidden {
      display: none !important;
    }

    .sidebar-nav li.resource-match > a,
    .sidebar-nav li.resource-match > strong {
      color: var(--theme-color);
      font-weight: 600;
    }

    .markdown-section {
      max-width: 920px;
    }

    .resource-preview {
      align-items: center;
      background: rgba(20, 23, 28, 0.58);
      bottom: 0;
      display: none;
      justify-content: center;
      left: 0;
      padding: 24px;
      position: fixed;
      right: 0;
      top: 0;
      z-index: 10000;
    }

    .resource-preview.is-open {
      display: flex;
    }

    .resource-preview-dialog {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 18px 50px rgba(20, 23, 28, 0.24);
      display: flex;
      flex-direction: column;
      max-height: min(82vh, 760px);
      max-width: 960px;
      overflow: hidden;
      width: min(92vw, 960px);
    }

    .resource-preview-head {
      align-items: center;
      border-bottom: 1px solid #ece7ed;
      display: flex;
      gap: 12px;
      justify-content: space-between;
      padding: 12px 16px;
    }

    .resource-preview-title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .resource-preview-actions {
      display: flex;
      gap: 8px;
      flex: 0 0 auto;
    }

    .resource-preview-actions a,
    .resource-preview-actions button {
      background: #fff;
      border: 1px solid #d8cdda;
      border-radius: 6px;
      color: #4b294d;
      cursor: pointer;
      font: inherit;
      line-height: 1;
      padding: 8px 10px;
      text-decoration: none;
    }

    .resource-preview-actions a:hover,
    .resource-preview-actions button:hover {
      border-color: var(--theme-color);
      color: var(--theme-color);
    }

    .resource-preview-body {
      background: #fbfafb;
      margin: 0;
      overflow: auto;
      padding: 16px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 82vw;
      }

      .content {
        padding-top: 12px;
      }

      .resource-preview {
        padding: 12px;
      }

      .resource-preview-dialog {
        max-height: 88vh;
        width: 100%;
      }

      .resource-preview-head {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div id="app">加载中...</div>
  <script>
    window.$docsify = {
      name: 'NKAI Share',
      repo: 'https://github.com/nkai-share/nankai-ai-Datashare',
      loadSidebar: true,
      loadNavbar: true,
      homepage: 'README.md',
      auto2top: true,
      relativePath: false, 
      subMaxLevel: 3, 
      sidebarDisplayLevel: 1,
      themeColor: '#702670',
      
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜索文件名...',
        noData: '未找到资料',
        depth: 2,
      },

      plugins: [
        function(hook, vm) {
          var fileExts = ['.pdf', '.zip', '.rar', '.7z', '.docx', '.doc', '.pptx', '.ppt', '.xlsx', '.xls', '.jpg', '.jpeg', '.png', '.txt', '.mp4'];
          var officeExts = ['.docx', '.doc', '.pptx', '.ppt', '.xlsx', '.xls'];
          var textExts = ['.txt'];

          function getBasePath() {
            var path = window.location.pathname;
            var lastSegment = path.split('/').pop();

            if (!lastSegment) return path;
            if (lastSegment.indexOf('.') === -1) return path + '/';
            return path.slice(0, path.lastIndexOf('/') + 1);
          }

          function isAttachment(href) {
            return matchesExtension(href, fileExts);
          }

          function isOfficeFile(href) {
            return matchesExtension(href, officeExts);
          }

          function isTextFile(href) {
            return matchesExtension(href, textExts);
          }

          function matchesExtension(href, extensions) {
            var cleanHref = href.split(/[?#]/)[0].toLowerCase();
            return extensions.some(function(ext) {
              return cleanHref.endsWith(ext) || cleanHref.includes(ext + '/');
            });
          }

          function cleanAssetPath(href) {
            return href.replace(/^#\/?/, '');
          }

          function getAssetUrl(href) {
            var cleanPath = cleanAssetPath(href);

            if (cleanPath.startsWith('http')) return cleanPath;
            if (cleanPath.startsWith('/')) return window.location.origin + cleanPath;

            return new URL(cleanPath, window.location.origin + getBasePath()).href;
          }

          function getOfficePreviewUrl(fileUrl) {
            return 'https://view.officeapps.live.com/op/view.aspx?src=' + encodeURIComponent(fileUrl);
          }

          function normalizeText(text) {
            return (text || '').toLowerCase().replace(/\s+/g, ' ').trim();
          }

          function directLabelOf(item) {
            for (var i = 0; i < item.children.length; i += 1) {
              if (item.children[i].matches('a, strong')) {
                return item.children[i].textContent;
              }
            }
            return '';
          }

          function hasVisibleChild(item) {
            for (var i = 0; i < item.children.length; i += 1) {
              if (item.children[i].tagName === 'UL' && item.children[i].querySelector('li:not(.resource-hidden)')) {
                return true;
              }
            }
            return false;
          }

          function filterSidebar(query) {
            var sidebar = document.querySelector('.sidebar-nav');
            if (!sidebar) return;

            var normalizedQuery = normalizeText(query);
            var items = Array.prototype.slice.call(sidebar.querySelectorAll('li')).reverse();

            items.forEach(function(item) {
              item.classList.remove('resource-hidden', 'resource-match');
            });

            if (!normalizedQuery) return;

            items.forEach(function(item) {
              var directMatch = normalizeText(directLabelOf(item)).indexOf(normalizedQuery) !== -1;
              var childMatch = hasVisibleChild(item);

              if (!directMatch && !childMatch) {
                item.classList.add('resource-hidden');
              }

              if (directMatch) {
                item.classList.add('resource-match');
              }
            });
          }

          function enhanceSearchBox() {
            var input = document.querySelector('.search input');
            if (!input || input.dataset.resourceFilter === 'true') return;

            input.dataset.resourceFilter = 'true';
            input.setAttribute('aria-label', '搜索资料文件名');
            input.addEventListener('input', function() {
              filterSidebar(input.value);
            });
          }

          function ensureTextPreviewModal() {
            var modal = document.getElementById('resource-text-preview');
            if (modal) return modal;

            modal = document.createElement('div');
            modal.id = 'resource-text-preview';
            modal.className = 'resource-preview';
            modal.innerHTML = [
              '<div class="resource-preview-dialog" role="dialog" aria-modal="true" aria-labelledby="resource-preview-title">',
              '  <div class="resource-preview-head">',
              '    <p class="resource-preview-title" id="resource-preview-title"></p>',
              '    <div class="resource-preview-actions">',
              '      <a href="#" target="_blank" rel="noopener noreferrer" data-open-original>打开原文件</a>',
              '      <button type="button" data-close>关闭</button>',
              '    </div>',
              '  </div>',
              '  <pre class="resource-preview-body"></pre>',
              '</div>'
            ].join('');

            modal.addEventListener('click', function(event) {
              if (event.target === modal || event.target.hasAttribute('data-close')) {
                closeTextPreview();
              }
            });

            document.addEventListener('keydown', function(event) {
              if (event.key === 'Escape') {
                closeTextPreview();
              }
            });

            document.body.appendChild(modal);
            return modal;
          }

          function closeTextPreview() {
            var modal = document.getElementById('resource-text-preview');
            if (modal) {
              modal.classList.remove('is-open');
            }
          }

          function decodeTextBuffer(buffer) {
            var encodings = ['utf-8', 'gb18030', 'gbk'];

            for (var i = 0; i < encodings.length; i += 1) {
              try {
                return new TextDecoder(encodings[i], { fatal: true }).decode(buffer);
              } catch (error) {
                // Try the next common Chinese text encoding.
              }
            }

            return new TextDecoder('utf-8').decode(buffer);
          }

          function showTextPreview(url, title) {
            var modal = ensureTextPreviewModal();
            var titleEl = modal.querySelector('.resource-preview-title');
            var bodyEl = modal.querySelector('.resource-preview-body');
            var originalLink = modal.querySelector('[data-open-original]');

            titleEl.textContent = title || '文本预览';
            bodyEl.textContent = '加载中...';
            originalLink.href = url;
            modal.classList.add('is-open');

            fetch(url)
              .then(function(response) {
                if (!response.ok) throw new Error('HTTP ' + response.status);
                return response.arrayBuffer();
              })
              .then(function(buffer) {
                bodyEl.textContent = decodeTextBuffer(buffer);
              })
              .catch(function(error) {
                bodyEl.textContent = '文本预览失败，请打开原文件查看。\\n' + error.message;
              });
          }

          function bindTextPreviewLinks() {
            var links = document.querySelectorAll('a[data-text-preview="true"]');

            links.forEach(function(link) {
              if (link.dataset.textPreviewBound === 'true') return;

              link.dataset.textPreviewBound = 'true';
              link.addEventListener('click', function(event) {
                event.preventDefault();
                showTextPreview(link.href, link.textContent);
              });
            });
          }

          function rewriteAttachmentLinks() {
            var links = document.querySelectorAll('.sidebar-nav a, .content a');

            links.forEach(function(link) {
              var href = link.getAttribute('href');

              if (!href || href.startsWith('mailto:') || (href.startsWith('#') && !href.startsWith('#/'))) return;

              if (isAttachment(href)) {
                var assetUrl = getAssetUrl(href);

                if (isTextFile(href)) {
                  link.setAttribute('href', assetUrl);
                  link.setAttribute('data-text-preview', 'true');
                  link.removeAttribute('target');
                } else if (isOfficeFile(href) && window.location.protocol === 'https:') {
                  link.setAttribute('href', getOfficePreviewUrl(assetUrl));
                  link.setAttribute('target', '_blank');
                } else {
                  link.setAttribute('href', assetUrl);
                  link.setAttribute('target', '_blank');
                }
                link.setAttribute('rel', 'noopener noreferrer');
              }
            });
          }

          hook.mounted(function() {
            setTimeout(enhanceSearchBox, 0);
          });

          hook.doneEach(function() {
            enhanceSearchBox();
            rewriteAttachmentLinks();
            bindTextPreviewLinks();
          });
        }
      ]
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
</body>
</html>
